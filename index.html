<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Error 404</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
    .error-404 {
      transform: translateY(2vh);
    }
    .error-404 h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.15;
      font-weight: 700;
    }
    .error-404 p {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 400;
      color: #444;
    }
  </style>
</head>
<body>
  <main class="error-404" role="main" aria-label="Page not found">
    <h1>Error 404</h1>
    <p>Page not found.</p>
  </main>
</body>
</html>
